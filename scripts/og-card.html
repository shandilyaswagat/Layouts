<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Work+Sans:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{background:#fff;color:#37352f;font-family:"Work Sans",-apple-system,sans-serif;
 display:flex;align-items:center;gap:48px;padding:0 60px;overflow:hidden}
.left{width:456px;flex:none}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:34px}
.mark{width:28px;height:28px;border-radius:8px;background:#397baf;display:grid;
 grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:6px}
.mark i{background:#fff;border-radius:2px;display:block}
.mark i:nth-child(1){grid-column:span 2}
.mark i:nth-child(2){opacity:.6}.mark i:nth-child(3){opacity:.85}
.wm{font-family:ui-serif,Georgia,serif;font-weight:700;font-size:27px;letter-spacing:-.5px}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:54px;
 line-height:1.06;letter-spacing:-.03em}
p{margin-top:20px;font-size:19px;line-height:1.55;color:#787774;max-width:440px}
.sw{margin-top:34px;display:flex;gap:9px}
.sw i{width:40px;height:40px;border-radius:8px;display:block}
.tag{margin-top:28px;display:inline-block;padding:7px 15px;border-radius:999px;
 background:#e8f1f6;color:#397baf;font-size:15px;font-weight:500;
 font-family:"JetBrains Mono",monospace}
.right{width:576px;height:324px;flex:none;background:#f7f6f3;border:1px solid #e9e9e7;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;
 box-shadow:0 2px 6px rgba(15,15,15,.05),0 30px 70px -20px rgba(15,15,15,.2)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{background:#fff;border:1px solid #efeeec;border-radius:9px;padding:10px 11px}
.k b{display:block;font-size:9.5px;color:#787774;font-weight:400}
.k s{display:block;margin-top:4px;font-size:18px;letter-spacing:-.03em;text-decoration:none}
.row{display:grid;grid-template-columns:1.55fr 1fr;gap:10px;flex:1;min-height:0}
.pan{background:#fff;border:1px solid #efeeec;border-radius:9px;padding:11px;min-height:0;
 display:flex;flex-direction:column}
.pt{font-size:10px;color:#787774;margin-bottom:9px}
.bars{flex:1;display:flex;align-items:flex-end;gap:7px;min-height:0}
.bars i{flex:1;border-radius:3px 3px 0 0;display:block}
.don{flex:1;display:grid;place-items:center}
.don div{width:92px;height:92px;border-radius:50%;
 background:conic-gradient(#9E1B2C 0 42%,#2B2644 42% 71%,#4A7C7E 71% 100%);
 -webkit-mask:radial-gradient(circle,transparent 56%,#000 57%)}
</style></head><body>
<div class="left">
 <div class="brand"><span class="mark"><i></i><i></i><i></i></span><span class="wm">Layoutss</span></div>
 <h1>Dashboard layouts, mockups and palettes.</h1>
 <p>Ready made grids and copy ready hex codes for Power BI, Tableau, Excel and the web.</p>
 <div class="sw"><i style="background:#5C1A22"></i><i style="background:#9E1B2C"></i><i style="background:#2B2644"></i><i style="background:#4A7C7E"></i><i style="background:#B08968"></i><i style="background:#E3D5CB"></i></div>
 <span class="tag">Free, no sign up</span>
</div>
<div class="right">
 <div class="kpis">
  <div class="k"><b>Revenue</b><s>$482K</s></div>
  <div class="k"><b>Orders</b><s>3,914</s></div>
  <div class="k"><b>Margin</b><s>28.4%</s></div>
 </div>
 <div class="row">
  <div class="pan"><div class="pt">Revenue by month</div>
   <div class="bars">
    <i style="height:38%;background:#9E1B2C"></i><i style="height:56%;background:#9E1B2C"></i>
    <i style="height:47%;background:#9E1B2C"></i><i style="height:72%;background:#9E1B2C"></i>
    <i style="height:61%;background:#9E1B2C"></i><i style="height:88%;background:#9E1B2C"></i>
    <i style="height:74%;background:#9E1B2C"></i></div></div>
  <div class="pan"><div class="pt">Mix</div><div class="don"><div></div></div></div>
 </div>
</div></body></html>
